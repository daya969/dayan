<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أخبار ضياء</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; text-align: center; padding: 50px; }
        .container { border: 2px solid #0f0; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 0 15px #0f0; }
        #timer { font-size: 2em; color: #ff0; display: none; }
        #news { display: none; color: #fff; font-size: 1.5em; border-top: 1px solid #0f0; margin-top: 20px; padding-top: 20px; }
        .btn { background: #0f0; color: #000; padding: 15px 30px; border: none; cursor: pointer; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ نظام أخبار ضياء ]</h1>
        <div id="setup">
            <p>فك تشفير الخبر يتطلب مشاركة الرابط..</p>
            <button class="btn" id="shareBtn">نـشـر الآن</button>
        </div>

        <div id="timer">جاري التحقق من النشر: <span id="seconds">3</span></div>

        <div id="news">
            <p>🔓 تم الوصول للبيانات:</p>
            <p>[ خبرنا لهذا اليوم:مياوباه شخت على القران ]</p>
        </div>
    </div>

    <script>
        const shareBtn = document.getElementById('shareBtn');
        const setup = document.getElementById('setup');
        const timerDiv = document.getElementById('timer');
        const secondsSpan = document.getElementById('seconds');
        const newsDiv = document.getElementById('news');

        shareBtn.onclick = async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'أخبار ضياء',
                        text: 'شاهد أخبار ضياء الحصرية!',
                        url: window.location.href
                    });
                    setup.style.display = 'none';
                    timerDiv.style.display = 'block';
                    let count = 3;
                    let countdown = setInterval(() => {
                        count--;
                        secondsSpan.innerText = count;
                        if (count <= 0) {
                            clearInterval(countdown);
                            timerDiv.style.display = 'none';
                            newsDiv.style.display = 'block';
                        }
                    }, 1000);
                } catch (err) {}
            } else {
                alert("يرجى نسخ الرابط ونشره يدوياً");
            }
        };
    </script>
</body>
</html>
